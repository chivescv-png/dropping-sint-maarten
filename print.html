<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wie zijn de Mechelaars? - papieren versie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #c0392b;
    --lantern: #e07b00;
    --ink: #2c1a0a;
    --muted: #8a5a2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12mm;
    background: #f5f2ee;
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
  }
  .sheet {
    display: flex;
    flex-direction: column;
    width: 190mm;
    min-height: 277mm;
    margin: 0 auto;
    padding: 10mm 8mm;
    background: #fff;
  }
  header { text-align: center; margin-bottom: 7mm; }
  .qr-link {
    position: static;
    display: block;
    align-self: center;
    width: max-content;
    margin: 4mm auto;
    color: var(--muted);
    text-decoration: none;
    font-size: 6pt;
    text-align: center;
  }
  .qr-link img {
    display: block;
    width: 18mm;
    height: 18mm;
    margin: 0 auto 1mm;
  }
  h1 {
    margin: 0 0 1.5mm;
    color: var(--accent);
    font-family: 'Fredoka', 'Nunito', sans-serif;
    font-size: 24pt;
  }
  .subtitle { margin: 4mm 0 0; color: var(--muted); font-size: 9pt; text-align: center; }
  .crossword { display: flex; flex-direction: column; gap: 1mm; }
  .puzzle-row { display: flex; align-items: center; justify-content: center; }
  .row-num {
    width: 7mm;
    margin-left: -7mm;
    padding-right: 1.5mm;
    color: var(--muted);
    text-align: right;
    font-size: 7pt;
  }
  .grid-row { display: flex; gap: 0.5mm; }
  .cell {
    width: 8mm;
    height: 8mm;
    border: 0.25mm solid transparent;
  }
  .cell-spacer { visibility: hidden; }
  .cell-white { border-color: #c8906a; background: #fff9f0; }
  .cell-grey { border: 0.45mm solid var(--lantern); background: #e8a830; }
  .footer {
    margin-top: 6mm;
    text-align: center;
    color: var(--muted);
    font-size: 7pt;
  }
  @page { size: A4 portrait; margin: 7mm; }
  @media print {
    body { padding: 0; background: #fff; }
    .sheet { width: auto; min-height: 282mm; }
  }
  @media screen and (max-width: 800px) {
    body { padding: 8px; overflow-x: auto; }
  }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <h1>Wie zijn de Mechelaars?</h1>
  </header>
  <p class="subtitle">Vul de liedjes in - de gouden kolom verraadt het geheim</p>
  <a class="qr-link" href="https://dropping-sint-maarten.onrender.com/">
    <img src="dropping-kruiswoord-qr.png" alt="QR-code naar de online muziekpuzzel">
    Scan voor de puzzel
  </a>
  <div class="crossword" id="crossword"></div>
</main>
<script>
const fallbackData = {
  totalCols: 14,
  secretCol: 6,
  rows: [
    { length: 7, start: 3 },
    { length: 9, start: 5 },
    { length: 8, start: 0 },
    { length: 7, start: 0 },
    { length: 4, start: 6 },
    { length: 4, start: 4 },
    { length: 9, start: 4 },
    { length: 9, start: 4 },
    { length: 5, start: 2 },
    { length: 11, start: 3 },
    { length: 7, start: 3 },
    { length: 9, start: 0 },
  ],
};

async function loadPuzzleData() {
  if (window.location.protocol === 'file:') return fallbackData;

  const response = await fetch('crossword_data.json');
  if (!response.ok) throw new Error('Could not load crossword_data.json');
  return response.json();
}

async function renderPrint() {
  const data = await loadPuzzleData();
  const crossword = document.getElementById('crossword');

  data.rows.forEach((row, ri) => {
    const puzzleRow = document.createElement('div');
    puzzleRow.className = 'puzzle-row';

    const num = document.createElement('div');
    num.className = 'row-num';
    num.textContent = ri + 1;
    puzzleRow.appendChild(num);

    const gridRow = document.createElement('div');
    gridRow.className = 'grid-row';
    const wordEnd = row.start + row.length - 1;

    for (let c = 0; c < data.totalCols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (c < row.start || c > wordEnd) {
        cell.classList.add('cell-spacer');
      } else {
        cell.classList.add(c === data.secretCol ? 'cell-grey' : 'cell-white');
      }
      gridRow.appendChild(cell);
    }

    puzzleRow.appendChild(gridRow);

    crossword.appendChild(puzzleRow);
  });

}

renderPrint().catch(error => {
  console.error('Could not render printable crossword:', error);
  const message = document.createElement('p');
  message.className = 'footer';
  message.textContent = 'De puzzel kon niet worden geladen.';
  document.querySelector('.sheet').appendChild(message);
});
</script>
</body>
</html>
