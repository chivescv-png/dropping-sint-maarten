<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sint Maarten gaat op stap - papieren versie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #c0392b;
    --lantern: #e07b00;
    --ink: #2c1a0a;
    --muted: #8a5a2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12mm;
    background: #f5f2ee;
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
  }
  .sheet {
    width: 190mm;
    min-height: 277mm;
    margin: 0 auto;
    padding: 10mm 8mm;
    background: #fff;
  }
  header { text-align: center; margin-bottom: 7mm; }
  .qr-link {
    position: absolute;
    left: 8mm;
    top: 10mm;
    color: var(--muted);
    text-decoration: none;
    font-size: 6pt;
  }
  .qr-link img {
    display: block;
    width: 18mm;
    height: 18mm;
    margin: 0 auto 1mm;
  }
  .lantern-row { font-size: 16pt; margin-bottom: 1mm; }
  .eyebrow {
    margin: 0 0 2mm;
    color: var(--accent);
    font-size: 7pt;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 1.5mm;
    color: var(--accent);
    font-family: 'Fredoka', 'Nunito', sans-serif;
    font-size: 24pt;
  }
  .subtitle { margin: 0; color: var(--muted); font-size: 9pt; }
  .crossword { display: flex; flex-direction: column; gap: 1mm; }
  .puzzle-row { display: flex; align-items: center; }
  .row-num {
    width: 7mm;
    padding-right: 1.5mm;
    color: var(--muted);
    text-align: right;
    font-size: 7pt;
  }
  .grid-row { display: flex; gap: 0.5mm; }
  .cell {
    width: 8mm;
    height: 8mm;
    border: 0.25mm solid transparent;
  }
  .cell-black { border: none; }
  .cell-white { border-color: #c8906a; background: #fff9f0; }
  .cell-grey { border: 0.45mm solid var(--lantern); background: #e8a830; }
  .row-clue {
    margin-left: 3mm;
    font-size: 7.5pt;
    white-space: nowrap;
  }
  .clue-artist { color: var(--muted); }
  .secret-section {
    margin-top: 8mm;
    text-align: center;
  }
  .secret-label {
    margin-bottom: 2mm;
    color: var(--muted);
    font-size: 7pt;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .secret-row { display: flex; justify-content: center; gap: 1mm; }
  .secret-cell {
    width: 8mm;
    height: 8mm;
    border: 0.25mm solid #c8906a;
    background: #fde8c0;
  }
  .footer {
    margin-top: 6mm;
    text-align: center;
    color: var(--muted);
    font-size: 7pt;
  }
  @page { size: A4 portrait; margin: 7mm; }
  @media print {
    body { padding: 0; background: #fff; }
    .sheet { width: auto; min-height: 282mm; }
  }
  @media screen and (max-width: 800px) {
    body { padding: 8px; overflow-x: auto; }
  }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <a class="qr-link" href="https://dropping-sint-maarten.onrender.com/">
      <img src="dropping-kruiswoord-qr.png" alt="QR-code naar de online muziekpuzzel">
      Scan voor de puzzel
    </a>
    <div class="lantern-row">🏮 🕯️ 🏮</div>
    <p class="eyebrow">Dropping · Muziekpuzzel</p>
    <h1>Sint Maarten gaat op stap</h1>
    <p class="subtitle">Vul de liedjes in - de gouden kolom verraadt het geheim</p>
  </header>
  <div class="crossword" id="crossword"></div>
  <section class="secret-section">
    <div class="secret-label">Geheim woord</div>
    <div class="secret-row" id="secretRow"></div>
  </section>
  <p class="footer">Schrijf in elk vakje een letter. De gouden kolom vormt samen het geheim woord.</p>
</main>
<script>
async function renderPrint() {
  const response = await fetch('crossword_data.json');
  const data = await response.json();
  const crossword = document.getElementById('crossword');

  data.rows.forEach((row, ri) => {
    const puzzleRow = document.createElement('div');
    puzzleRow.className = 'puzzle-row';

    const num = document.createElement('div');
    num.className = 'row-num';
    num.textContent = ri + 1;
    puzzleRow.appendChild(num);

    const gridRow = document.createElement('div');
    gridRow.className = 'grid-row';
    const wordEnd = row.start + row.length - 1;

    for (let c = 0; c < data.totalCols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (c < row.start || c > wordEnd) {
        cell.classList.add('cell-black');
      } else {
        cell.classList.add(c === data.secretCol ? 'cell-grey' : 'cell-white');
      }
      gridRow.appendChild(cell);
    }

    puzzleRow.appendChild(gridRow);

    const clue = document.createElement('div');
    clue.className = 'row-clue';
    clue.innerHTML = `<span class="clue-artist">${row.artist}</span>`;
    puzzleRow.appendChild(clue);
    crossword.appendChild(puzzleRow);
  });

  const secretRow = document.getElementById('secretRow');
  data.rows.forEach(() => {
    const cell = document.createElement('div');
    cell.className = 'secret-cell';
    secretRow.appendChild(cell);
  });
}

renderPrint();
</script>
</body>
</html>
