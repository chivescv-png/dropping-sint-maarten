<title>Sint Maarten gaat op stap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Sint Maarten palette — lantern warmth: deep red, amber, warm white */
:root {
  --bg:          #fdf6ec;
  --fg:          #2c1a0a;
  --fg-muted:    #8a5a2e;
  --accent:      #c0392b;
  --accent2:     #e07b00;
  --cell-black:  #2c1a0a;
  --cell-grey:   #e8a830;
  --cell-grey-fg:#1a0e00;
  --cell-white:  #fff9f0;
  --cell-border: #c8906a;
  --secret-bg:   #fde8c0;
  --header-rule: #e8a830;
  --lantern:     #e07b00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:          #1c0e04;
    --fg:          #f5e0c0;
    --fg-muted:    #b08050;
    --accent:      #e05040;
    --accent2:     #d08020;
    --cell-black:  #100802;
    --cell-grey:   #7a4a10;
    --cell-grey-fg:#fde8c0;
    --cell-white:  #281808;
    --cell-border: #6a3820;
    --secret-bg:   #221008;
    --header-rule: #7a4a10;
    --lantern:     #d08020;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:          #1c0e04;
  --fg:          #f5e0c0;
  --fg-muted:    #b08050;
  --accent:      #e05040;
  --accent2:     #d08020;
  --cell-black:  #100802;
  --cell-grey:   #7a4a10;
  --cell-grey-fg:#fde8c0;
  --cell-white:  #281808;
  --cell-border: #6a3820;
  --secret-bg:   #221008;
  --header-rule: #7a4a10;
  --lantern:     #d08020;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Nunito', system-ui, sans-serif;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
  max-width: 1000px;
  margin: 0 auto;
}

/* ── Header ── */
header {
  text-align: center;
  margin-bottom: 32px;
}
.lantern-row {
  font-size: 2rem;
  margin-bottom: 4px;
  letter-spacing: 0.1em;
}
header .eyebrow {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
  font-weight: 600;
}
h1 {
  font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
  font-size: clamp(1.9rem, 6vw, 3rem);
  color: var(--accent);
  margin: 0 0 6px;
  text-wrap: balance;
  line-height: 1.1;
  font-weight: 700;
}
header .sub {
  font-size: 0.9rem;
  color: var(--fg-muted);
  font-weight: 500;
}
.header-rule {
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  margin: 14px auto 0;
  border-radius: 2px;
}

/* ── Crossword layout ── */
.crossword-scroll { overflow-x: auto; }

.crossword {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: max-content;
  margin: 0 auto;
}

.puzzle-row {
  display: flex;
  align-items: center;
}

.row-num {
  width: 26px;
  text-align: right;
  padding-right: 6px;
  font-size: 11px;
  color: var(--fg-muted);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  line-height: 34px;
  font-weight: 600;
}

.grid-row {
  display: flex;
  gap: 1.5px;
}

.cell {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  position: relative;
}
.cell-black {
  background: var(--cell-black);
  border-radius: 2px;
}
.cell-white {
  background: var(--cell-white);
  border: 1.5px solid var(--cell-border);
  border-radius: 1px;
}
.cell-grey {
  background: var(--cell-grey);
  border: 1.5px solid var(--lantern);
  border-radius: 1px;
}
.cell-white, .cell-grey {
  display: flex;
  align-items: center;
  justify-content: center;
}

.cell input {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--fg);
  outline: none;
  padding: 0;
  font-family: 'Nunito', system-ui, sans-serif;
  caret-color: var(--accent);
  -webkit-appearance: none;
}
.cell-grey input {
  color: var(--cell-grey-fg);
  font-weight: 800;
}
.cell input:focus {
  background: rgba(192,57,43,0.10);
}

/* clues */
.row-clue {
  font-size: 13px;
  white-space: nowrap;
  padding-left: 10px;
  line-height: 34px;
  color: var(--fg);
}
.clue-song { font-weight: 700; }
.clue-dash { color: var(--fg-muted); margin: 0 4px; }
.clue-artist { color: var(--fg-muted); font-size: 12px; font-weight: 500; }
.clue-player {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  font-size: 15px;
  line-height: 34px;
  margin-left: 8px;
  padding: 0;
  vertical-align: middle;
}
.clue-player:hover, .clue-player:focus-visible {
  color: var(--accent2);
  outline: none;
}
.clue-player.playing { color: var(--accent); }

#spotify-hidden {
  position: fixed;
  right: 0;
  bottom: 0;
  width: 300px;
  height: 80px;
  overflow: hidden;
  pointer-events: none;
  opacity: 0;
  z-index: -1;
}

/* ── Secret word display ── */
.secret-section {
  margin-top: 32px;
  text-align: center;
}
.secret-label {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 10px;
  font-weight: 700;
}
.secret-row {
  display: flex;
  justify-content: center;
  gap: 3px;
  flex-wrap: wrap;
}
.secret-cell {
  width: 34px;
  height: 34px;
  background: var(--secret-bg);
  border: 1.5px solid var(--cell-border);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  color: var(--fg-muted);
  font-family: 'Nunito', system-ui, sans-serif;
  transition: background 0.25s, color 0.25s, border-color 0.25s;
}
.secret-cell.has-letter { color: var(--fg); }
.reveal-msg {
  margin-top: 14px;
  font-size: 1.05rem;
  font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
  font-weight: 600;
  color: var(--accent);
  min-height: 1.5em;
  transition: opacity 0.3s;
}

/* ── Print ── */
@media print {
  body { background: white !important; color: black !important; }
  .cell-black { background: white !important; border: none !important; }
  .cell-grey  { background: #f0c060 !important; print-color-adjust: exact; }
  .cell-white { background: white !important; }
  .reveal-msg { display: none; }
  .lantern-row { display: none; }
}
</style>

<header>
  <div class="lantern-row">🏮 🕯️ 🏮</div>
  <p class="eyebrow">Dropping · Muziekpuzzel</p>
  <h1>Sint Maarten gaat op stap</h1>
  <p class="sub">Vul de liedjes in — de gouden kolom verraadt het geheim</p>
  <div class="header-rule"></div>
</header>

<div class="crossword-scroll">
  <div class="crossword" id="cw"></div>
</div>

<div class="secret-section">
  <div class="secret-label">Geheim woord</div>
  <div class="secret-row" id="secretRow"></div>
  <div class="reveal-msg" id="revealMsg"></div>
</div>

<div id="spotify-hidden" aria-hidden="true">
  <div id="spotify-embed-target"></div>
</div>

<script>
const fallbackData = {
  totalCols: 14,
  secretCol: 6,
  rows: [
    { length: 7, start: 3, song: 'Niemand', artist: 'Suzan & Freek', spotifyId: '2ZodgwtywVovNUNIcKDpbD' },
    { length: 9, start: 5, song: 'Gaan we weg', artist: 'Roxy Dekker & Ronnie Flex', spotifyId: '6MUfSTr5MKTgX9oziFxx8c' },
    { length: 8, start: 0, song: 'Gasolina', artist: 'DIKKE', spotifyId: '4BTiunrWSAMGCB4HuvqYJr' },
    { length: 7, start: 0, song: 'The Cure', artist: 'Olivia Rodrigo', spotifyId: '55pBIZO1cqoldeqpp5WR7H' },
    { length: 4, start: 6, song: 'Baby', artist: 'Justin Bieber', spotifyId: '6epn3r7S14KUqlReYr77hA' },
    { length: 4, start: 4, song: 'Pile', artist: 'Mauvais Djo', spotifyId: '0PMhBcbq0a5EDngAlVQLAy' },
    { length: 9, start: 4, song: 'Housewife', artist: 'Tate McRae', spotifyId: '2sFepQNyl1WjpROruP8bJ0' },
    { length: 9, start: 4, song: 'Cassandra', artist: 'Pommelien Thijs', spotifyId: '3bxhuc9hkpZpOJFHxq2qri' },
    { length: 5, start: 2, song: 'Pretty Girls', artist: 'Frenna', spotifyId: '4skvJoTBLEYUfS3Z1xvGjs' },
    { length: 11, start: 3, song: 'Dure Geintje', artist: 'LASSA & Mensa', spotifyId: '0LAQc7pyZaVxo7C6czJ7rz' },
    { length: 7, start: 3, song: 'Energie', artist: 'Ronnie Flex', spotifyId: '1riPE3NCV1OBmSXqpYiMJY' },
    { length: 9, start: 0, song: 'Overdosis', artist: 'Bilal Wahid', spotifyId: '1PHlNckjnBedkWSNhQ6nvr' },
  ],
};

async function loadPuzzle() {
  try {
    const response = await fetch('crossword_data.json');
    if (!response.ok) throw new Error('Could not load puzzle data');
    return await response.json();
  } catch (error) {
    return fallbackData;
  }
}

let spotifyController = null;
let pendingUri = null;
let currentWord = null;
let currentButton = null;
let autoPlayPending = false;

window.onSpotifyIframeApiReady = (IFrameAPI) => {
  IFrameAPI.createController(
    document.getElementById('spotify-embed-target'),
    { uri: 'spotify:track:2ZodgwtywVovNUNIcKDpbD', height: '80' },
    (controller) => {
      spotifyController = controller;
      controller.addListener('playback_update', (event) => {
        if (autoPlayPending && event.data.isPaused && !event.data.isBuffering) {
          autoPlayPending = false;
          controller.play();
        }
      });
      if (pendingUri) {
        autoPlayPending = true;
        controller.loadUri(pendingUri);
        pendingUri = null;
      }
    }
  );
};

(function loadSpotifyIframeApi() {
  const script = document.createElement('script');
  script.src = 'https://open.spotify.com/embed/iframe-api/v1';
  script.async = true;
  document.head.appendChild(script);
})();

function toggleSpotify(row, button) {
  if (!row.spotifyId) {
    const query = encodeURIComponent(`${row.song} ${row.artist}`);
    window.open(`https://open.spotify.com/search/${query}`, '_blank', 'noopener,noreferrer');
    return;
  }

  const uri = `spotify:track:${row.spotifyId}`;
  if (currentWord === row.song) {
    autoPlayPending = false;
    pendingUri = null;
    spotifyController?.pause();
    button.textContent = '▶';
    button.classList.remove('playing');
    currentWord = null;
    currentButton = null;
    return;
  }

  if (currentButton) {
    currentButton.textContent = '▶';
    currentButton.classList.remove('playing');
  }

  if (spotifyController) {
    autoPlayPending = true;
    spotifyController.loadUri(uri);
    spotifyController.play();
  } else {
    pendingUri = uri;
  }

  button.textContent = '■';
  button.classList.add('playing');
  currentWord = row.song;
  currentButton = button;
}

async function renderPuzzle() {
  const data = await loadPuzzle();
  const TOTAL_COLS = data.totalCols;
  const SECRET_COL = data.secretCol;
  const rows = data.rows;

const inputs = rows.map(() => new Array(TOTAL_COLS).fill(null));

const secretCells = [];
const secretRowEl = document.getElementById('secretRow');
rows.forEach(() => {
  const div = document.createElement('div');
  div.className = 'secret-cell';
  secretRowEl.appendChild(div);
  secretCells.push(div);
});

function updateSecret() {
  let allFilled = true;
  rows.forEach((row, ri) => {
    const inp = inputs[ri][SECRET_COL];
    const val = inp ? inp.value.toUpperCase() : '';
    const sc = secretCells[ri];
    sc.textContent = val;
    sc.classList.toggle('has-letter', !!val);
    if (!val) allFilled = false;
  });
  document.getElementById('revealMsg').textContent =
    allFilled ? '🏮 Alle gouden vakjes zijn ingevuld!' : '';
}

const cwEl = document.getElementById('cw');

rows.forEach((row, ri) => {
  const puzzleRow = document.createElement('div');
  puzzleRow.className = 'puzzle-row';

  const numDiv = document.createElement('div');
  numDiv.className = 'row-num';
  numDiv.textContent = ri + 1;
  puzzleRow.appendChild(numDiv);

  const gridRow = document.createElement('div');
  gridRow.className = 'grid-row';

  const wordEnd = row.start + row.length - 1;

  for (let c = 0; c < TOTAL_COLS; c++) {
    const cellDiv = document.createElement('div');
    cellDiv.className = 'cell';

    if (c < row.start || c > wordEnd) {
      cellDiv.classList.add('cell-black');
    } else {
      const isSecret = c === SECRET_COL;
      cellDiv.classList.add(isSecret ? 'cell-grey' : 'cell-white');

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.maxLength = 1;
      inp.autocomplete = 'off';
      inp.spellcheck = false;
      inp.inputMode = 'text';
      inp.setAttribute('aria-label', `Rij ${ri + 1}, cel ${c - row.start + 1}`);

      inp.addEventListener('focus', () => inp.select());

      inp.addEventListener('input', () => {
        inp.value = inp.value.toUpperCase().replace(/[^A-Z]/g, '').slice(-1);
        updateSecret();
        if (inp.value && c < wordEnd) {
          const next = inputs[ri][c + 1];
          if (next) { next.focus(); next.select(); }
        }
      });

      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && c > row.start) {
          const prev = inputs[ri][c - 1];
          if (prev) { prev.value = ''; prev.focus(); prev.select(); updateSecret(); }
        }
        if (e.key === 'ArrowRight' && c < wordEnd) {
          const next = inputs[ri][c + 1];
          if (next) next.focus();
        }
        if (e.key === 'ArrowLeft' && c > row.start) {
          const prev = inputs[ri][c - 1];
          if (prev) prev.focus();
        }
        if (e.key === 'ArrowDown' && ri < rows.length - 1) {
          const col = Math.min(c, rows[ri+1].start + rows[ri+1].word.length - 1);
          const below = inputs[ri+1][Math.max(col, rows[ri+1].start)];
          if (below) below.focus();
        }
        if (e.key === 'ArrowUp' && ri > 0) {
          const col = Math.min(c, rows[ri-1].start + rows[ri-1].word.length - 1);
          const above = inputs[ri-1][Math.max(col, rows[ri-1].start)];
          if (above) above.focus();
        }
      });

      cellDiv.appendChild(inp);
      inputs[ri][c] = inp;
    }

    gridRow.appendChild(cellDiv);
  }

  puzzleRow.appendChild(gridRow);

  const clueDiv = document.createElement('div');
  clueDiv.className = 'row-clue';
  clueDiv.innerHTML =
    `<span class="clue-song">${row.song}</span>` +
    `<span class="clue-dash">—</span>` +
    `<span class="clue-artist">${row.artist}</span>`;
  const playerButton = document.createElement('button');
  playerButton.className = 'clue-player';
  playerButton.type = 'button';
  playerButton.title = `Speel ${row.song} — ${row.artist}`;
  playerButton.setAttribute('aria-label', `Speel ${row.song} door ${row.artist}`);
  playerButton.textContent = '▶';
  playerButton.addEventListener('click', () => toggleSpotify(row, playerButton));
  clueDiv.appendChild(playerButton);
  puzzleRow.appendChild(clueDiv);

  cwEl.appendChild(puzzleRow);
});

}

renderPuzzle();
</script>
