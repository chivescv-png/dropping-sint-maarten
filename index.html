<!DOCTYPE html>
<html lang="nl">
<meta charset="UTF-8">
<title>Wie zijn de Mechelaars?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">

<style>
:root {
  --bg:          #fdf6ec;
  --fg:          #2c1a0a;
  --fg-muted:    #8a5a2e;
  --accent:      #c0392b;
  --accent2:     #e07b00;
  --header-rule: #e8a830;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:          #1c0e04;
    --fg:          #f5e0c0;
    --fg-muted:    #b08050;
    --accent:      #e05040;
    --accent2:     #d08020;
    --header-rule: #7a4a10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:          #1c0e04;
  --fg:          #f5e0c0;
  --fg-muted:    #b08050;
  --accent:      #e05040;
  --accent2:     #d08020;
  --header-rule: #7a4a10;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: Verdana, Geneva, sans-serif;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
  max-width: 1000px;
  margin: 0 auto;
}

/* ── Header ── */
header {
  text-align: center;
  margin-bottom: 32px;
}
h1 {
  font-family: Verdana, Geneva, sans-serif;
  font-size: clamp(1.9rem, 6vw, 3rem);
  color: var(--accent);
  margin: 0 0 6px;
  text-wrap: balance;
  line-height: 1.1;
  font-weight: 700;
}
.fire-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 6px 0 10px;
  line-height: 1;
}
.fire-row span {
  display: inline-block;
  font-size: 1.25rem;
  transform-origin: center bottom;
  animation: fire-flicker 1s ease-in-out infinite alternate;
}
.fire-row span:nth-child(2) { animation-delay: 180ms; }
.fire-row span:nth-child(3) { animation-delay: 360ms; }
@keyframes fire-flicker {
  from { opacity: 0.82; transform: scale(0.92) rotate(-4deg); }
  to { opacity: 1; transform: scale(1.08) rotate(4deg); }
}
header .sub {
  font-size: 0.9rem;
  color: var(--fg-muted);
  font-weight: 500;
  line-height: 1.5;
  max-width: 38rem;
  margin: 0 auto;
}
.header-rule {
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  margin: 14px auto 0;
  border-radius: 2px;
}

.track-list {
  max-width: 420px;
  margin: 0 auto;
  padding-left: 2.5rem;
  list-style: decimal;
}
.track-list li {
  min-height: 48px;
  margin-bottom: 6px;
  padding-left: 8px;
  border-bottom: 1px solid var(--fg-muted);
}

.clue-player {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  font: inherit;
  font-size: 18px;
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) {
  .clue-player:hover { color: var(--accent2); }
}
.clue-player:focus-visible {
  color: var(--accent2);
  outline: 2px solid var(--accent2);
  outline-offset: 2px;
  border-radius: 4px;
}
.clue-player.playing { color: var(--accent); }

@media (max-width: 600px) {
  body { padding-block: 20px; }
  header { margin-bottom: 20px; }
  h1 { font-size: clamp(1.7rem, 8vw, 2.2rem); }
  header .sub { padding: 0 4px; }
  .header-rule { margin-top: 10px; }
  .track-list { max-width: 100%; padding-left: 2.25rem; }
  .track-list li { margin-bottom: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  .fire-row span { animation: none; }
}

</style>

<header>
  <h1>Wie zijn de Mechelaars?</h1>
  <div class="fire-row" aria-hidden="true"><span>🔥</span><span>🔥</span><span>🔥</span></div>
  <p class="sub">Druk op ▶ bij een nummer om het liedje te beluisteren. Herken jij het?</p>
  <div class="header-rule"></div>
</header>

<ol class="track-list" id="track-list"></ol>

<audio id="clip-audio" preload="none" playsinline></audio>

<script>
// Audio comes from Apple's 30-second previews, played in our own <audio>
// element. Nothing about the song (title, artist, artwork) is ever shown.
const fallbackData = {
  rows: [
    { appleId: '1845874656' },
    { appleId: '1753741796' },
    { appleId: '1638882049' },
    { appleId: '6771598356' },
    { appleId: '1440803626' },
    { appleId: '6813131671' },
    { appleId: '6822497774' },
    { appleId: '1829654536' },
    { appleId: '1808950758' },
    { appleId: '1440878599' },
    { appleId: '1440899681' },
    { appleId: '1831696505' },
  ],
};

const audio = document.getElementById('clip-audio');
const playerButtons = [];   // { button, index, row }
let rows = [];
let previewUrls = {};       // appleId -> preview URL
let status = 'loading';     // 'loading' | 'ready' | 'error'
let current = null;         // entry from playerButtons that owns the audio
let pending = false;        // play() called, waiting for 'playing'

async function loadPuzzle() {
  try {
    const response = await fetch('crossword_data.json');
    if (!response.ok) throw new Error('Could not load puzzle data');
    return await response.json();
  } catch (error) {
    return fallbackData;
  }
}

async function loadPreviews() {
  status = 'loading';
  render();
  const ids = rows.map(r => r.appleId).filter(Boolean).join(',');
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);
  try {
    const response = await fetch(
      `https://itunes.apple.com/lookup?id=${ids}&country=BE&entity=song`,
      { signal: controller.signal }
    );
    if (!response.ok) throw new Error(`Lookup failed: ${response.status}`);
    const { results } = await response.json();
    previewUrls = {};
    results.forEach(r => {
      if (r.previewUrl) previewUrls[String(r.trackId)] = r.previewUrl;
    });
    status = 'ready';
  } catch (error) {
    console.error(error);
    status = 'error';
  } finally {
    clearTimeout(timeout);
    render();
  }
}

function render() {
  playerButtons.forEach(entry => {
    const { button, index, row } = entry;
    const n = index + 1;
    let text, label;
    if (status === 'loading') {
      text = '…'; label = 'Liedjes worden geladen';
    } else if (status === 'error' || !previewUrls[row.appleId]) {
      text = '↻'; label = `Opnieuw proberen voor nummer ${n}`;
    } else if (entry === current && pending) {
      text = '…'; label = `Nummer ${n} wordt geladen`;
    } else if (entry === current && !audio.paused) {
      text = '■'; label = `Stop nummer ${n}`;
    } else {
      text = '▶'; label = `Speel liedje voor nummer ${n}`;
    }
    button.disabled = status === 'loading';
    button.textContent = text;
    button.title = label;
    button.setAttribute('aria-label', label);
    button.classList.toggle('playing', entry === current && !audio.paused);
  });
}

function onButton(entry) {
  const url = previewUrls[entry.row.appleId];
  if (!url) {
    loadPreviews();
    return;
  }

  if (entry === current && !audio.paused) {
    audio.pause();
    return;
  }

  if (entry !== current) {
    audio.src = url;
    current = entry;
  }
  pending = true;
  render();
  // play() must be called synchronously inside the tap handler for iOS.
  const p = audio.play();
  if (p && p.catch) {
    p.catch(error => {
      console.error(error);
      pending = false;
      render();
    });
  }
}

audio.addEventListener('playing', () => { pending = false; render(); });
audio.addEventListener('pause', () => { pending = false; render(); });
audio.addEventListener('ended', () => { pending = false; audio.currentTime = 0; render(); });
audio.addEventListener('error', () => {
  console.error('Audio error', audio.error);
  pending = false;
  render();
});

async function renderPlaylist() {
  ({ rows } = await loadPuzzle());
  const trackList = document.getElementById('track-list');

  rows.forEach((row, index) => {
    const item = document.createElement('li');
    const button = document.createElement('button');
    button.className = 'clue-player';
    button.type = 'button';
    const entry = { button, index, row };
    button.addEventListener('click', () => onButton(entry));
    playerButtons.push(entry);
    item.appendChild(button);
    trackList.appendChild(item);
  });

  await loadPreviews();
}

renderPlaylist();
</script>
