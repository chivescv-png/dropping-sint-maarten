<title>Wie zijn de Mechelaars?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">

<style>
:root {
  --bg:          #fdf6ec;
  --fg:          #2c1a0a;
  --fg-muted:    #8a5a2e;
  --accent:      #c0392b;
  --accent2:     #e07b00;
  --header-rule: #e8a830;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:          #1c0e04;
    --fg:          #f5e0c0;
    --fg-muted:    #b08050;
    --accent:      #e05040;
    --accent2:     #d08020;
    --header-rule: #7a4a10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:          #1c0e04;
  --fg:          #f5e0c0;
  --fg-muted:    #b08050;
  --accent:      #e05040;
  --accent2:     #d08020;
  --header-rule: #7a4a10;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: Verdana, Geneva, sans-serif;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
  max-width: 1000px;
  margin: 0 auto;
}

/* ── Header ── */
header {
  text-align: center;
  margin-bottom: 32px;
}
h1 {
  font-family: Verdana, Geneva, sans-serif;
  font-size: clamp(1.9rem, 6vw, 3rem);
  color: var(--accent);
  margin: 0 0 6px;
  text-wrap: balance;
  line-height: 1.1;
  font-weight: 700;
}
.fire-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 6px 0 10px;
  line-height: 1;
}
.fire-row span {
  display: inline-block;
  font-size: 1.25rem;
  transform-origin: center bottom;
  animation: fire-flicker 1s ease-in-out infinite alternate;
}
.fire-row span:nth-child(2) { animation-delay: 180ms; }
.fire-row span:nth-child(3) { animation-delay: 360ms; }
@keyframes fire-flicker {
  from { opacity: 0.82; transform: scale(0.92) rotate(-4deg); }
  to { opacity: 1; transform: scale(1.08) rotate(4deg); }
}
header .sub {
  font-size: 0.9rem;
  color: var(--fg-muted);
  font-weight: 500;
  line-height: 1.5;
  max-width: 38rem;
  margin: 0 auto;
}
.header-rule {
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  margin: 14px auto 0;
  border-radius: 2px;
}

.track-list {
  max-width: 420px;
  margin: 0 auto;
  padding-left: 2.5rem;
  list-style: decimal;
}
.track-list li {
  min-height: 48px;
  margin-bottom: 6px;
  padding-left: 8px;
  border-bottom: 1px solid var(--fg-muted);
}

.clue-player {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  font: inherit;
  font-size: 18px;
  min-width: 44px;
  min-height: 44px;
  padding: 0;
}
.clue-player:hover {
  color: var(--accent2);
}
.clue-player:focus-visible {
  color: var(--accent2);
  outline: 2px solid var(--accent2);
  outline-offset: 2px;
  border-radius: 4px;
}
.clue-player.playing { color: var(--accent); }

#spotify-hidden {
  position: fixed;
  right: 0;
  bottom: 0;
  width: 300px;
  height: 80px;
  overflow: hidden;
  pointer-events: none;
  opacity: 0;
  z-index: -1;
}

@media (max-width: 600px) {
  body { padding-block: 20px; }
  header { margin-bottom: 20px; }
  h1 { font-size: clamp(1.7rem, 8vw, 2.2rem); }
  header .sub { padding: 0 4px; }
  .header-rule { margin-top: 10px; }
  .track-list { max-width: 100%; padding-left: 2.25rem; }
  .track-list li { margin-bottom: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  .fire-row span { animation: none; }
}

</style>

<header>
  <h1>Wie zijn de Mechelaars?</h1>
  <div class="fire-row" aria-hidden="true"><span>🔥</span><span>🔥</span><span>🔥</span></div>
  <p class="sub">Druk op ▶ bij een nummer om het liedje te beluisteren. Herken jij het?</p>
  <div class="header-rule"></div>
</header>

<ol class="track-list" id="track-list"></ol>

<div id="spotify-hidden" aria-hidden="true">
  <div id="spotify-embed-target"></div>
</div>

<script>
const fallbackData = {
  rows: [
    { artist: 'Suzan & Freek', spotifyId: '2ZodgwtywVovNUNIcKDpbD' },
    { artist: 'Roxy Dekker & Ronnie Flex', spotifyId: '6MUfSTr5MKTgX9oziFxx8c' },
    { artist: 'DIKKE', spotifyId: '4BTiunrWSAMGCB4HuvqYJr' },
    { artist: 'Olivia Rodrigo', spotifyId: '55pBIZO1cqoldeqpp5WR7H' },
    { artist: 'Justin Bieber', spotifyId: '6epn3r7S14KUqlReYr77hA' },
    { artist: 'Mauvais Djo', spotifyId: '0PMhBcbq0a5EDngAlVQLAy' },
    { artist: 'Tate McRae', spotifyId: '2sFepQNyl1WjpROruP8bJ0' },
    { artist: 'Pommelien Thijs', spotifyId: '3bxhuc9hkpZpOJFHxq2qri' },
    { artist: 'Frenna', spotifyId: '4skvJoTBLEYUfS3Z1xvGjs' },
    { artist: "Lil' Kleine", spotifyId: '0JdKB06zZsPXmfvQVeJS35' },
    { artist: 'Ronnie Flex', spotifyId: '1riPE3NCV1OBmSXqpYiMJY' },
    { artist: 'Bilal Wahid', spotifyId: '1PHlNckjnBedkWSNhQ6nvr' },
  ],
};

async function loadPuzzle() {
  try {
    const response = await fetch('crossword_data.json');
    if (!response.ok) throw new Error('Could not load puzzle data');
    return await response.json();
  } catch (error) {
    return fallbackData;
  }
}

let spotifyController = null;
let currentWord = null;
let currentButton = null;
let spotifyStatus = 'loading';
let spotifyLoadTimeout = null;
const playerButtons = [];

function updatePlayerButtons() {
  playerButtons.forEach(({ button, index }) => {
    button.disabled = spotifyStatus === 'loading';
    button.textContent = spotifyStatus === 'loading'
      ? 'Loading...'
      : spotifyStatus === 'unavailable'
        ? 'Open Spotify'
        : '▶';
    button.title = spotifyStatus === 'loading'
      ? 'Spotify is loading'
      : `Speel liedje voor nummer ${index + 1}`;
    button.setAttribute(
      'aria-label',
      spotifyStatus === 'loading'
        ? 'Spotify is loading'
        : spotifyStatus === 'unavailable'
          ? `Open liedje voor nummer ${index + 1} in Spotify`
          : `Speel liedje voor nummer ${index + 1}`
    );
  });
}

function markSpotifyUnavailable(error) {
  if (spotifyController) return;
  spotifyStatus = 'unavailable';
  window.clearTimeout(spotifyLoadTimeout);
  console.error(error);
  updatePlayerButtons();
}

window.onSpotifyIframeApiReady = (IFrameAPI) => {
  IFrameAPI.createController(
    document.getElementById('spotify-embed-target'),
    { uri: 'spotify:track:2ZodgwtywVovNUNIcKDpbD', height: '80' },
    (controller) => {
      spotifyController = controller;
      spotifyStatus = 'ready';
      window.clearTimeout(spotifyLoadTimeout);
      updatePlayerButtons();
    }
  );
};

(function loadSpotifyIframeApi() {
  const script = document.createElement('script');
  script.src = 'https://open.spotify.com/embed/iframe-api/v1';
  script.async = true;
  script.onerror = () => markSpotifyUnavailable(new Error('Could not load the Spotify player'));
  spotifyLoadTimeout = window.setTimeout(
    () => markSpotifyUnavailable(new Error('Spotify player initialization timed out')),
    15000
  );
  document.head.appendChild(script);
})();

function toggleSpotify(row, button) {
  if (!row.spotifyId) {
    const query = encodeURIComponent(row.artist);
    window.open(`https://open.spotify.com/search/${query}`, '_blank', 'noopener,noreferrer');
    return;
  }

  const uri = `spotify:track:${row.spotifyId}`;
  if (!spotifyController) {
    if (spotifyStatus === 'unavailable') {
      window.open(`https://open.spotify.com/track/${row.spotifyId}`, '_blank', 'noopener,noreferrer');
    }
    return;
  }

  if (currentWord === row.spotifyId) {
    spotifyController.pause();
    button.textContent = '▶';
    button.classList.remove('playing');
    currentWord = null;
    currentButton = null;
    return;
  }

  if (currentButton) {
    currentButton.textContent = '▶';
    currentButton.classList.remove('playing');
  }

  spotifyController.loadUri(uri);
  spotifyController.play();

  button.textContent = '■';
  button.classList.add('playing');
  currentWord = row.spotifyId;
  currentButton = button;
}

async function renderPlaylist() {
  const { rows } = await loadPuzzle();
  const trackList = document.getElementById('track-list');

  rows.forEach((row, index) => {
    const item = document.createElement('li');
    const playerButton = document.createElement('button');
    playerButton.className = 'clue-player';
    playerButton.type = 'button';
    playerButton.addEventListener('click', () => toggleSpotify(row, playerButton));
    playerButtons.push({ button: playerButton, index });
    updatePlayerButtons();
    item.appendChild(playerButton);
    trackList.appendChild(item);
  });
}

renderPlaylist();
</script>
